name: Engineering checks
on:
  push:
    paths-ignore: ['output/**', 'output_iran/**', '.state/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/install_cores.py
      - run: ruff check openray tests tools
      - run: ruff format --check .
      - run: python -m unittest discover -v
      - run: python -m openray.benchmarks --count 1000 --output artifacts/benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engineering-${{ matrix.os }}
          path: artifacts/
