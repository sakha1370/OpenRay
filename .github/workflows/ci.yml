name: Engineering checks
on:
  push:
    paths-ignore: ['output/**', 'output_iran/**', '.state/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/install_cores.py
      - run: ruff check openray tests tools
      - run: ruff format --check .
      - run: python -m unittest discover -v
      - run: python -m openray.benchmarks --count 1000 --output artifacts/benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: engineering-${{ matrix.os }}
          path: artifacts/
