name: Durable collector and publisher
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: combined
permissions:
  contents: read
  actions: read
concurrency:
  group: openray-data-main
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Restore the last transactional checkpoint
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/state_artifact.py .state/openray.sqlite3
      - run: python tools/import_regional.py
      - run: python tools/install_cores.py
      - name: Validate and stage
        env:
          OPENRAY_STAGE3_BACKEND: subprocess
          OPENRAY_STAGE3_WORKERS: '8'
          OPENRAY_RUN_BUDGET_S: '2700'
          RUN_MODE: ${{ inputs.mode }}
        run: python -m openray run --mode "$RUN_MODE" --report artifacts/run.json
      - run: python tools/stage_artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openray-snapshot
          path: artifacts/snapshot/
          retention-days: 7
          include-hidden-files: true
      - name: Save initialized transactional checkpoint
        if: always() && steps.restore.outcome == 'success'
        run: |
          if test -f .state/openray.sqlite3; then
            python -m openray maintenance --apply --retention-days 90
            python -m openray backup artifacts/checkpoint.sqlite3
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openray-state
          path: artifacts/checkpoint.sqlite3
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openray-run-${{ github.run_id }}
          path: artifacts/run.json
          retention-days: 30
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openray-snapshot
          path: artifacts/snapshot
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/install_cores.py singbox mihomo
      - run: python -m openray publish artifacts/snapshot
